<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 288">
<rect width="512" height="288" rx="18" fill="#061525"/>
<rect x="18" y="18" width="476" height="252" rx="16" fill="#0a2139" stroke="#214568"/>
<text x="34" y="48" fill="#ffd23f" font-size="11" font-family="Arial" font-weight="700">RATOTURBO • APRENDER</text>
<text x="34" y="78" fill="#f8fafc" font-size="24" font-family="Arial" font-weight="700">Movimento correto dos dedos</text>
<text x="34" y="98" fill="#afbdd0" font-size="11" font-family="Arial">O dedo sai da base, toca a tecla e volta.</text>
<g transform="translate(70 124)">
<rect width="108" height="108" rx="14" fill="#091d33" stroke="#214568"/>
<circle cx="18" cy="18" r="12" fill="#ff7a00"/><text x="18" y="22" text-anchor="middle" fill="#fff" font-size="11" font-family="Arial" font-weight="700">1</text>
<text x="36" y="22" fill="#fff" font-size="10" font-family="Arial" font-weight="700">Linha base</text>
<text x="12" y="42" fill="#afbdd0" font-size="8" font-family="Arial">Comece no F.</text>
<rect x="40" y="62" width="28" height="28" rx="5" fill="#12365c" stroke="#46a7ff"/><text x="54" y="81" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial" font-weight="700">F</text>
</g><g transform="translate(202 124)">
<rect width="108" height="108" rx="14" fill="#091d33" stroke="#214568"/>
<circle cx="18" cy="18" r="12" fill="#ff7a00"/><text x="18" y="22" text-anchor="middle" fill="#fff" font-size="11" font-family="Arial" font-weight="700">2</text>
<text x="36" y="22" fill="#fff" font-size="10" font-family="Arial" font-weight="700">Alcança a tecla</text>
<text x="12" y="42" fill="#afbdd0" font-size="8" font-family="Arial">Mova só o dedo.</text>
<rect x="40" y="62" width="28" height="28" rx="5" fill="#12365c" stroke="#46a7ff"/><text x="54" y="81" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial" font-weight="700">R</text>
</g><g transform="translate(334 124)">
<rect width="108" height="108" rx="14" fill="#091d33" stroke="#214568"/>
<circle cx="18" cy="18" r="12" fill="#ff7a00"/><text x="18" y="22" text-anchor="middle" fill="#fff" font-size="11" font-family="Arial" font-weight="700">3</text>
<text x="36" y="22" fill="#fff" font-size="10" font-family="Arial" font-weight="700">Volta para a base</text>
<text x="12" y="42" fill="#afbdd0" font-size="8" font-family="Arial">Retorne ao F.</text>
<rect x="40" y="62" width="28" height="28" rx="5" fill="#12365c" stroke="#46a7ff"/><text x="54" y="81" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial" font-weight="700">F</text>
</g>
<path d="M268 192 C286 160 309 154 333 165" fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>
<path d="M398 192 C381 216 354 217 333 199" fill="none" stroke="#46a7ff" stroke-width="4" stroke-linecap="round"/>
<rect x="118" y="246" width="276" height="18" rx="9" fill="#091d33" stroke="#ffd23f"/>
<text x="256" y="259" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="Arial">Evite mover a mão inteira — o movimento vem do dedo.</text>
