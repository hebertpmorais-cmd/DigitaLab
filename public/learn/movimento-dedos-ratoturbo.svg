<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
<rect width="1200" height="675" rx="30" fill="#061525"/>
<path d="M0 0h1200v8H0z" fill="#ff7a00"/>
<text x="60" y="72" fill="#ffd23f" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">RATOTURBO • APRENDER</text>
<text x="60" y="135" fill="#f8fafc" font-family="Arial,sans-serif" font-size="48" font-weight="800">Movimento correto dos dedos</text>
<text x="60" y="180" fill="#afbdd0" font-family="Arial,sans-serif" font-size="24">O dedo sai da linha base, toca a tecla da sua região e volta</text>

<g font-family="Arial,sans-serif">
  <g transform="translate(50 240)">
    <rect width="340" height="300" rx="22" fill="#0a2139" stroke="#214568" stroke-width="3"/>
    <circle cx="50" cy="50" r="28" fill="#ff7a00"/><text x="50" y="59" text-anchor="middle" fill="#061525" font-size="25" font-weight="800">1</text>
    <text x="95" y="58" fill="#fff" font-size="25" font-weight="700">Linha base</text>
    <text x="30" y="105" fill="#afbdd0" font-size="17">Comece com o indicador no F.</text>
    <rect x="55" y="155" width="70" height="65" rx="10" fill="#ff7a00" stroke="#ffd23f" stroke-width="4"/>
    <text x="90" y="197" text-anchor="middle" fill="#061525" font-size="28" font-weight="800">F</text>
    <path d="M90 258 V225" stroke="#46a7ff" stroke-width="16" stroke-linecap="round"/>
    <text x="170" y="260" fill="#46a7ff" font-size="15">mão parada</text>
  </g>

  <g transform="translate(430 240)">
    <rect width="340" height="300" rx="22" fill="#0a2139" stroke="#214568" stroke-width="3"/>
    <circle cx="50" cy="50" r="28" fill="#ff7a00"/><text x="50" y="59" text-anchor="middle" fill="#061525" font-size="25" font-weight="800">2</text>
    <text x="95" y="58" fill="#fff" font-size="25" font-weight="700">Alcança a tecla</text>
    <text x="30" y="105" fill="#afbdd0" font-size="17">Só o dedo se move até a tecla.</text>
    <rect x="55" y="185" width="70" height="65" rx="10" fill="#12365c" stroke="#46a7ff" stroke-width="3"/>
    <text x="90" y="227" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">F</text>
    <rect x="215" y="135" width="70" height="65" rx="10" fill="#ff7a00" stroke="#ffd23f" stroke-width="4"/>
    <text x="250" y="177" text-anchor="middle" fill="#061525" font-size="28" font-weight="800">R</text>
    <path d="M105 195 C145 155 175 145 210 160" fill="none" stroke="#ffd23f" stroke-width="9" stroke-linecap="round"/>
    <path d="M203 148 L222 160 L204 174" fill="#ffd23f"/>
  </g>

  <g transform="translate(810 240)">
    <rect width="340" height="300" rx="22" fill="#0a2139" stroke="#214568" stroke-width="3"/>
    <circle cx="50" cy="50" r="28" fill="#ff7a00"/><text x="50" y="59" text-anchor="middle" fill="#061525" font-size="25" font-weight="800">3</text>
    <text x="95" y="58" fill="#fff" font-size="25" font-weight="700">Volta para a base</text>
    <text x="30" y="105" fill="#afbdd0" font-size="17">Depois da tecla, volte ao F.</text>
    <rect x="55" y="185" width="70" height="65" rx="10" fill="#ff7a00" stroke="#ffd23f" stroke-width="4"/>
    <text x="90" y="227" text-anchor="middle" fill="#061525" font-size="28" font-weight="800">F</text>
    <rect x="215" y="135" width="70" height="65" rx="10" fill="#12365c" stroke="#46a7ff" stroke-width="3"/>
    <text x="250" y="177" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">R</text>
    <path d="M230 190 C190 230 155 235 115 220" fill="none" stroke="#46a7ff" stroke-width="9" stroke-linecap="round"/>
    <path d="M123 208 L104 220 L122 234" fill="#46a7ff"/>
  </g>
</g>

<rect x="160" y="580" width="880" height="58" rx="18" fill="#081b30" stroke="#ffd23f" stroke-width="2"/>
<text x="600" y="616" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Evite mover a mão inteira — o movimento principal deve vir do dedo.</text>
</svg>